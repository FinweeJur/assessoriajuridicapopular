<div class="radio-flut" data-radio data-aberto="false">
  <button data-dica="Abrir ou fechar o rádio" class="radio-flut__botao" type="button" data-radio-toggle aria-expanded="false" aria-controls="radio-painel">
    <span aria-hidden="true">📻</span> Rádio
  </button>
  <div class="radio-flut__painel" id="radio-painel">
    <div class="rp__coluna">
      <div class="rp__cabeca">
        <p class="rp__titulo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
          Índice de rádios
        </p>
        <a class="rp__ver" href="https://controlepopular.com.br/radio" target="_blank" rel="noopener" title="Abrir o diretório completo no Controle Popular">Ver todas →</a>
        <button class="rp__fechar" type="button" data-radio-fechar aria-label="Fechar o índice de rádios" title="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="rp__lista" data-radio-lista></div>
    </div>
    <div class="rp__volume-col">
      <button class="rp__mudo" type="button" data-radio-mudo aria-label="Silenciar rádio" aria-pressed="false" title="Silenciar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <div class="rp__medidor" data-radio-medidor role="slider" tabindex="0" aria-label="Volume da rádio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-orientation="vertical" data-interactive="true">
        <span class="rp__valor rp__valor--fora" aria-hidden="true">100%</span>
        <div class="rp__liquido" aria-hidden="true"><span class="rp__valor rp__valor--dentro">100%</span></div>
        <div class="rp__marcas" aria-hidden="true"></div>
        <div class="rp__marca" aria-hidden="true"></div>
      </div>
      <span class="rp__pct" data-radio-pct aria-hidden="true">100%</span>
    </div>
    <p class="rp__status" data-radio-status aria-live="polite"></p>
  </div>
  <audio data-radio-audio preload="none"></audio>
</div>
